# ============================================================================
# WALK PHASE — --resume the stand run (NOT --initialize-from). Resume keeps the
# optimizer momentum + value baseline + normalizer from the 1M stand run, so layering
# the walking rewards on top is a gentle transition and the standing skill is RETAINED.
# --initialize-from threw that continuity away and the policy forgot how to stand, so we
# use --resume instead. Trains in the SAME folder (results/ybot_stand_03); the step
# counter continues from ~1M and the ONNX grows from stand -> walk.
#
# Behavior PhysicalAgentZone0, obs/action 58/21 unchanged. Curriculum = REWARD changes
# only (Unity-side flags). Do NOT add ray sensors — that changes the obs spec and breaks
# --resume. BACK UP the pure-stand model first if you want to keep it (see below).
#
# Launch (gotcha #2 — trainer FIRST, then press Play):
#   mlagents-learn Assets/BSGIntegration/config/ybot_walk.yaml \
#     --run-id=ybot_stand_03 --resume
# ============================================================================
default_settings:
  checkpoint_interval: 10000
  keep_checkpoints: 5

behaviors:
  PhysicalAgentZone0:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048           # Unity Walker reference values for physics locomotion
      buffer_size: 40960         # 20 batches/update — stable for high-DOF balance+walk
      learning_rate: 3.0e-4      # Walker-recommended; 5e-4 is too aggressive over tens of M steps
      beta: 5.0e-3               # Walker-standard entropy; 8e-3 over-explored and slowed convergence
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      # CONSTANT (not linear): this is a multi-phase --resume curriculum (walk -> arms -> grasp on
      # ONE run). A linear schedule decays the rate to 0 at max_steps, leaving no learning capacity
      # for the later weeks and forcing a reset. Constant keeps every resumed phase trainable.
      learning_rate_schedule: constant
      beta_schedule: constant
    # LOCKED for the entire curriculum — changing any of these makes the checkpoint incompatible
    # and is the ONLY thing (besides the 58/21 obs/action spec) that would force a reset.
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.995             # longer reward horizon — recommended for sustained locomotion (Walker uses 0.995)
        strength: 1.0
    max_steps: 50000000          # headroom for stand+walk+arms+grasp on one run, so it never stops early
    time_horizon: 1000
    summary_freq: 30000

env_settings:
  env_path: null
  env_args: null
  base_port: 5004
  num_envs: 1
  num_areas: 4
  seed: -1
  max_lifetime_restarts: 10
  restarts_rate_limit_n: 1
  restarts_rate_limit_period_s: 60

engine_settings:
  width: 84
  height: 84
  quality_level: 5
  time_scale: 1.0
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false

# Resume the stand run in-place so optimizer/value state carry over (retains balance).
checkpoint_settings:
  run_id: ybot_stand_03
  initialize_from: null
  load_model: false
  resume: true
  force: false
  train_model: true
  inference: false
  results_dir: results

torch_settings:
  device: null

debug: false
